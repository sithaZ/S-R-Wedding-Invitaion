<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4e5b22">
    <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ | Somaly &amp; Monyroath</title>
    <link rel="stylesheet" href="assets/css/buttons.css?v=2">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        .cover { position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin-inline: auto; overflow: hidden; }
        .cover-stage { position: absolute; top: 50%; left: 50%; width: max(100%, calc(100vh * 1125 / 2079)); width: max(100%, calc(100dvh * 1125 / 2079)); transform: translate(-50%, -50%); }
        .cover-art { display: block; width: 100%; height: auto; }
        .open-button { position: absolute; top: 71.765%; left: 28.533%; display: block; width: 41.778%; border: 0; padding: 0; background: none; border-radius: 999px; }
        .open-button img { display: block; width: 100%; height: auto; border-radius: 999px; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
</head>
<body>
    <main class="cover" aria-label="Somaly and Monyroath wedding invitation cover">
        <div class="cover-stage">
            <img class="cover-art" src="assets/images/CoverImage.png?v=2" width="1125" height="2079" fetchpriority="high" alt="សិរីមង្គលអាពាហ៍ពិពាហ៍ — Somaly and Monyroath">
            <a class="open-button animated-button" href="invitation.html" aria-label="បើកសំបុត្រអញ្ជើញ — Open wedding invitation">
                <img src="assets/images/OpenButton.png?v=2" width="470" height="155" alt="ចុចបើកសំបុត្រ">
            </a>
        </div>
    </main>
</body>
</html>
